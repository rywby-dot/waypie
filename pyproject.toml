[project]
name = "waypie"
version = "2.0.0"
description = "GTK configurator for the Rust Waypie radial menu"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pycairo>=1.27",
    "PyGObject>=3.50",
]

[project.urls]
Repository = "https://github.com/rywby-dot/waypie"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "waypie_config.py",
    "waypie_common.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/waypie_config.py",
    "/waypie_common.py",
]

[project.scripts]
waypie-config = "waypie_config:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402"]
