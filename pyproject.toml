[project]
name = "waypie"
version = "1.1.1"
description = "GTK configurator for the Rust Waypie radial menu"
requires-python = ">=3.11"
dependencies = [
    "pycairo>=1.27",
    "PyGObject>=3.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "waypie_animation.py",
    "waypie_config.py",
    "waypie_common.py",
]

[project.scripts]
waypie-config = "waypie_config:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402"]
