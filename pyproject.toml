[project]
name = "waypie"
version = "1.0.0"
description = "Kando-like pie menu for Wayland"
requires-python = ">=3.11"
dependencies = [
    "pycairo>=1.27",
    "PyGObject>=3.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["waypie.py"]

[project.scripts]
waypie = "waypie:main"
waypie-config = "waypie:configurator_main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402"]
