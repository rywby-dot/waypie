name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install check tools
        run: python -m pip install build ruff

      - name: Check formatting
        run: ruff format --check waypie.py

      - name: Lint
        run: ruff check waypie.py

      - name: Check syntax
        run: python -m py_compile waypie.py

      - name: Build package
        run: python -m build
