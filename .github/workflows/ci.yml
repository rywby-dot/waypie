name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks and builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install check tools
        run: python -m pip install build ruff

      - name: Run checks
        run: make check RUFF=ruff PYTHON=python

      - name: Build Python configurator package
        run: python -m build

      - name: Build Rust runtime
        run: make build
